```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mashplum Netizen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<h1>Mashplum Netizen</h1>

<h2>Images</h2>
<div id="images"></div>

<h2>Files</h2>
<div id="files"></div>

<script>
const repo = "mashplum-netizen/mashplum-netizen.github.io";

async function showFolder(folder, imageTypes = false) {
    const response = await fetch(
        `https://api.github.com/repos/${repo}/contents/${folder}`
    );

    const files = await response.json();

    files.forEach(file => {
        const link = document.createElement("a");
        link.href = file.download_url;
        link.textContent = file.name;
        link.target = "_blank";

        if (imageTypes && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)) {
            const image = document.createElement("img");
            image.src = file.download_url;
            image.alt = file.name;
            image.style.maxWidth = "500px";
            image.style.display = "block";
            image.style.marginBottom = "10px";

            const label = document.createElement("p");
            label.appendChild(link);

            document.getElementById("images").appendChild(image);
            document.getElementById("images").appendChild(label);
        } else {
            const paragraph = document.createElement("p");
            paragraph.appendChild(link);
            document.getElementById("files").appendChild(paragraph);
        }
    });
}

showFolder("images", true);
showFolder("");
</script>

</body>
</html>
```
